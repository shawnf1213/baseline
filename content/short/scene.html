<!doctype html>
<meta charset="utf-8">
<title>Baseline — daily short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   THE PICTURE FOLLOWS THE SENTENCE. Every panel's window comes from plan.json,
   which was written from the MEASURED length of each synthesised line — so a
   panel is on screen for exactly as long as it is being talked about, on any
   day, whatever the voice does with the words.

   Everything shown is the pick AS POSTED: the line, the projection and the
   supporting reads are the stored model_inputs, not a re-run.
   ───────────────────────────────────────────────────────────────────────── */
:root{ --g:#00E676; --r:#FF5C5C; --dim:#a8b6ae; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d1113}
body{font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#base{position:absolute;inset:0;background:
  radial-gradient(1200px 1400px at 50% 38%, #2b343a 0%, #1a2226 44%, #121719 76%, #0e1214 100%)}
#key{position:absolute;inset:-14%;filter:blur(28px)}
.bok{position:absolute;border-radius:50%;filter:blur(20px)}
#grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:3px 3px}
#vig{position:absolute;inset:0;background:
  radial-gradient(closest-side at 50% 50%, transparent 62%, rgba(0,0,0,.46) 100%)}
.seg{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 70px;text-align:center;
  will-change:transform,opacity}
.kick{font-family:"Barlow Condensed";font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;color:var(--acc);text-shadow:0 0 30px rgba(var(--accrgb),.5)}
.name{font-family:"Barlow Condensed";font-weight:900;color:#fff;line-height:.92;
  text-shadow:0 6px 34px rgba(0,0,0,.55)}
.big{font-family:"Barlow Condensed";font-weight:900;line-height:.86}
.card{position:relative;width:100%;border-radius:46px;padding:56px 54px;
  background:linear-gradient(168deg,#3a4440 0%,#28312e 42%,#1b2220 100%);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.24), inset 0 -5px 0 rgba(0,0,0,.34),
    0 4px 0 #232b28, 0 10px 0 #1d2421, 0 16px 0 #171d1b,
    0 40px 80px rgba(0,0,0,.46),
    0 0 0 2px rgba(var(--accrgb),.46), 0 0 130px rgba(var(--accrgb),.28)}
.tile{width:100%;border-radius:26px;padding:26px 30px;text-align:left;
  background:linear-gradient(170deg,#333d39,#242c29);margin-top:20px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14), 0 6px 0 #1d2421,
             0 16px 28px rgba(0,0,0,.4), 0 0 0 1.6px rgba(255,255,255,.06)}
.tlab{font-family:"Barlow Condensed";font-weight:800;font-size:28px;
  letter-spacing:.18em;color:#a3b3ab;text-transform:uppercase}
.tval{font-family:"Barlow Condensed";font-weight:900;font-size:62px;color:#fff;
  margin-top:6px;line-height:1}
</style>

<div id="stage">
  <div id="base"></div><div id="key"></div><div id="bokwrap"></div>

  <!-- THE HOOK. A logo and a date is the least interesting thing you can put in
       front of someone who is scrolling; it asks them to wait. This leads with
       the claim instead — the side and the number, at the largest type in the
       whole video, punched in with an overshoot and a shockwave so there is
       motion on the very first frame. -->
  <div class="seg" id="s_hook">
    <div id="hk_ring" style="position:absolute;width:520px;height:520px;
         border-radius:50%;border:8px solid var(--acc);opacity:0;
         pointer-events:none"></div>
    <div class="kick" id="hook_label" style="font-size:54px"></div>
    <div class="big" id="hk_claim" style="font-size:280px;color:var(--acc);
         margin-top:14px;text-shadow:0 0 110px rgba(var(--accrgb),.75)"></div>
    <div class="name" id="hk_player" style="font-size:86px;margin-top:34px"></div>
    <div class="kick" id="hk_sub" style="font-size:38px;color:#a8b6ae;
         margin-top:20px;text-shadow:none"></div>
  </div>

  <div class="seg" id="s_who">
    <div class="kick" id="who_prop" style="font-size:42px"></div>
    <div class="name" id="who_name" style="font-size:132px;margin-top:28px"></div>
    <div id="who_opp" style="font-size:52px;color:var(--dim);margin-top:30px"></div>
    <div class="kick" id="who_tour" style="font-size:32px;color:#a8b6ae;
         margin-top:34px;text-shadow:none"></div>
  </div>

  <div class="seg" id="s_line">
    <div class="card">
      <div class="tlab">Book line</div>
      <div class="big" id="ln_book" style="font-size:190px;color:#fff"></div>
      <div class="kick" style="font-size:44px;margin:22px 0 10px">&darr;</div>
      <div class="tlab">Baseline projects</div>
      <div class="big" id="ln_proj" style="font-size:210px;color:var(--acc);
           text-shadow:0 0 80px rgba(var(--accrgb),.6)"></div>
      <div class="kick" id="ln_edge" style="font-size:52px;margin-top:26px"></div>
    </div>
  </div>

  <div class="seg" id="s_why">
    <div class="kick" style="font-size:38px;margin-bottom:10px">Why</div>
    <div id="why_tiles" style="width:100%"></div>
  </div>

  <div class="seg" id="s_verdict">
    <div class="big" id="v_lean" style="font-size:250px;color:var(--acc);
         text-shadow:0 0 90px rgba(var(--accrgb),.65)"></div>
    <div class="name" id="v_num" style="font-size:120px;margin-top:6px"></div>
    <svg width="360" height="360" style="margin-top:52px">
      <circle cx="180" cy="180" r="150" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="26"/>
      <circle id="v_arc" cx="180" cy="180" r="150" fill="none" stroke-width="26"
              stroke-linecap="round" transform="rotate(-90 180 180)"/>
      <text id="v_pct" x="180" y="208" text-anchor="middle" fill="#fff"
            font-family="Barlow Condensed" font-weight="900" font-size="108">0</text>
    </svg>
  </div>

  <div class="seg" id="s_cta">
    <img src="logo.png" style="width:560px;filter:drop-shadow(0 14px 70px rgba(0,230,118,.6))">
    <div class="kick" id="cta_url" style="font-size:60px;margin-top:44px;color:var(--g)">baselineev.com</div>
    <div style="font-size:26px;color:#8fa098;margin-top:44px;line-height:1.5">
      Model projections, not betting advice.<br>21+. Please gamble responsibly.</div>
  </div>

  <div id="grain"></div><div id="vig"></div>
</div>

<script>
const $ = id => document.getElementById(id)
const cl = v => Math.max(0, Math.min(1, v))
const lerp = (a,b,t) => a + (b-a)*t
const oCubic = t => 1 - Math.pow(1-t,3)
const P = (t,a,b) => cl((t-a)/(b-a))
let PLAN = null, SEG = {}

;(function(){
  let s = 11; const rnd = () => (s = (s*1103515245+12345) % 2147483648) / 2147483648
  const w = document.getElementById('bokwrap')
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div'); d.className = 'bok'
    const sz = 80 + rnd()*260; d.style.width = d.style.height = sz+'px'
    d.style.left = (rnd()*1080)+'px'; d.style.top = (rnd()*1920)+'px'
    d.dataset.op = (0.10 + rnd()*0.24).toFixed(3)
    d.dataset.sp = (0.3+rnd()*0.9).toFixed(3); d.dataset.y0 = parseFloat(d.style.top)
    w.appendChild(d)
  }
})()

window.__init = function (plan) {
  PLAN = plan
  for (const s of plan.segments) SEG[s.id] = s
  const p = plan.pick, mi = p.inputs || {}
  const over = String(p.lean || '').toUpperCase() === 'OVER'
  const acc = over ? '#00E676' : '#FF5C5C'
  const rgb = over ? '0,230,118' : '255,92,92'
  document.documentElement.style.setProperty('--acc', acc)
  document.documentElement.style.setProperty('--accrgb', rgb)
  $('key').style.background =
    'radial-gradient(760px 620px at 34% 30%, rgba(' + rgb + ',.34), transparent 68%),' +
    'radial-gradient(660px 540px at 70% 70%, rgba(' + rgb + ',.20), transparent 72%)'
  for (const d of document.querySelectorAll('.bok'))
    d.style.background = 'rgba(' + rgb + ',.6)'
  $('v_arc').setAttribute('stroke', acc)

  $('hook_label').textContent = plan.kind === 'potd' ? 'Pick of the day'
    : plan.kind === 'top' ? '#1 on the board'
    : String(plan.kind)          // e.g. '#2 play'
  $('who_prop').textContent = p.prop
  $('who_name').textContent = p.player
  $('who_opp').textContent = 'vs ' + p.opponent
  $('who_tour').textContent = [p.tournament, p.surface].filter(Boolean).join('  ·  ')

  const fmt = v => (Number(v) === Math.round(Number(v))) ? String(Math.round(v)) : String(v)
  $('hk_claim').textContent = String(p.lean || '').toUpperCase() + ' ' + fmt(p.line)
  $('hk_player').textContent = p.player
  $('hk_sub').textContent = p.prop + '  ·  vs ' + p.opponent
  $('ln_book').textContent = fmt(p.line)
  $('ln_proj').textContent = fmt(p.projection)
  const edge = Math.round((p.projection - p.line) * 10) / 10
  $('ln_edge').textContent = (edge > 0 ? '+' : '') + edge + ' edge'

  const tiles = []
  if (typeof mi.opp_hold === 'number')
    tiles.push(['Opponent hold rate', Math.round(mi.opp_hold) + '%'])
  if (typeof mi.expected_sets === 'number')
    tiles.push(['Expected sets', mi.expected_sets + '  ' +
      '<span style="font-size:34px;color:#8fa098">' + (mi.match_format || '') + '</span>'])
  if (typeof mi.bp_base_proj === 'number')
    tiles.push(['Base projection', mi.bp_base_proj])
  $('why_tiles').innerHTML = tiles.map((t, i) =>
    '<div class="tile" id="tile' + i + '"><div class="tlab">' + t[0] +
    '</div><div class="tval">' + t[1] + '</div></div>').join('')

  $('v_lean').textContent = String(p.lean || '').toUpperCase()
  $('v_num').textContent = fmt(p.projection) + ' vs ' + fmt(p.line)
  window.__setT(0)
}

const ARC = 2 * Math.PI * 150

window.__setT = function (t) {
  if (!PLAN) return
  for (const d of document.querySelectorAll('.bok')) {
    d.style.transform = 'translateY(' +
      (parseFloat(d.dataset.y0) - t*14*parseFloat(d.dataset.sp)).toFixed(2) + 'px)'
    d.style.opacity = d.dataset.op
  }
  // ── TRANSITIONS ────────────────────────────────────────────────────────
  // A CROSS-DISSOLVE WITH DRIFT, not a cut. Each panel rises into place as the
  // previous one lifts away and fades, overlapping by TR so there is never a
  // hard edge between them.
  //
  // Dissolving was wrong for the landscape promo — those frames were dense edge
  // to edge, so two of them on screen together read as a double exposure. These
  // panels are a single centred block surrounded by space, and consecutive ones
  // sit at different heights, so they pass through each other cleanly. Same
  // technique, opposite call, because the content is not the same shape.
  const TR = 0.5
  const sstep = x => x * x * (3 - 2 * x)          // smooth at both ends
  for (const s of PLAN.segments) {
    const el = $('s_' + s.id)
    if (!el) continue
    const end = s.start + s.dur + (s.id === 'cta' ? 1.4 : 0.22)
    if (t < s.start - TR || t > end + TR) { el.style.display = 'none'; continue }
    el.style.display = 'flex'
    // begins arriving slightly BEFORE its line starts, so the voice lands on a
    // panel that has already settled rather than one still moving
    const inP = sstep(cl((t - (s.start - TR * 0.6)) / TR))
    const outP = sstep(cl((t - end) / TR))
    el.style.opacity = (inP * (1 - outP)).toFixed(3)
    const y = lerp(54, 0, inP) - lerp(0, 54, outP)
    const sc = lerp(1.04, 1, inP) * lerp(1, 0.975, outP)
    el.style.transform = 'translateY(' + y.toFixed(1) + 'px) scale(' +
                         sc.toFixed(4) + ')'
  }
  // ── THE HOOK'S IMPACT ──────────────────────────────────────────────────
  // Staggered overshoot: each line arrives slightly late and slightly too big,
  // then settles. The claim also gets a shockwave — a ring that expands out of
  // it and fades — so the first half second carries real movement instead of a
  // static card waiting for the voice to catch up.
  const h = SEG.hook
  if (h) {
    const oBack = x => { const c = 3.1, c3 = c + 1
      return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
    // Opacity resolves almost instantly while the SCALE does the settling, so
    // frame zero already shows the claim mid-slam rather than an empty panel.
    // That frame is both the first thing a scroller sees and the default
    // thumbnail, and it was arriving blank.
    const pop = (el, at, dur, from) => {
      if (!el) return
      const a = cl(P(t, h.start + at, h.start + at + dur))
      el.style.opacity = cl(a * 8).toFixed(3)
      el.style.transform = 'scale(' + lerp(from, 1, oBack(a)).toFixed(4) + ')'
    }
    pop($('hook_label'), 0.00, 0.30, 0.62)
    pop($('hk_claim'),   0.00, 0.42, 2.30)   // the big one, from way oversized
    pop($('hk_player'),  0.26, 0.32, 0.70)
    pop($('hk_sub'),     0.38, 0.30, 0.80)
    const r = $('hk_ring')
    if (r) {
      const a = cl(P(t, h.start + 0.14, h.start + 0.78))
      r.style.opacity = (a < 1 ? (1 - a) * 0.75 : 0).toFixed(3)
      r.style.transform = 'scale(' + lerp(0.25, 2.6, a).toFixed(3) + ')'
    }
  }

  const w = SEG.why
  if (w) for (let i = 0; i < 3; i++) {
    const el = $('tile' + i); if (!el) continue
    const a = cl(P(t, w.start + 0.45 + i * 0.85, w.start + 0.95 + i * 0.85))
    el.style.opacity = a
    el.style.transform = 'translateY(' + lerp(26, 0, oCubic(a)).toFixed(1) + 'px)'
  }
  const v = SEG.verdict
  if (v) {
    // The SAME number Discord posted — plan.pick.confidence_display, computed by
    // the bot's own calibration. It read bp_p_over here, which is P(over): on an
    // UNDER pick that ring would have counted up to the probability of the side
    // we were not taking.
    const cd = PLAN.pick.confidence_display
    const target = (typeof cd === 'number') ? cd : 0
    const c = target * oCubic(P(t, v.start + 0.2, v.start + 1.5))
    $('v_arc').setAttribute('stroke-dasharray', (ARC*c/100).toFixed(2)+' '+ARC.toFixed(2))
    $('v_pct').textContent = Math.round(c)
  }
}
</script>
